<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:hsl(250 30% 98%);--fg:hsl(250 30% 12%);--card:#fff;--muted:hsl(250 20% 95%);--muted-fg:hsl(250 10% 40%);
  --border:hsl(250 20% 88%);--primary:hsl(262 83% 58%);--primary-fg:#fff;--primary-soft:hsl(262 83% 96%);
  --accent:hsl(340 82% 52%);--accent-soft:hsl(340 82% 96%);--sidebar:hsl(262 70% 15%);--sidebar-fg:hsl(262 30% 86%);
  --sidebar-hi:hsl(262 55% 26%);--radius:.75rem;--ring:hsl(262 83% 58%);
  --ok:hsl(142 70% 27%);--ok-bg:hsl(142 60% 92%);--warn:hsl(30 90% 32%);--warn-bg:hsl(42 95% 90%);
  --bad:hsl(0 72% 42%);--bad-bg:hsl(0 85% 95%);--info:hsl(214 80% 38%);--info-bg:hsl(214 90% 94%);
  --neu:hsl(220 9% 36%);--neu-bg:hsl(220 14% 93%);--vio:hsl(262 60% 45%);--vio-bg:hsl(262 80% 95%);
  --shadow:0 1px 2px rgb(20 10 50/.06),0 6px 20px rgb(30 10 60/.07);--overlay:rgb(15 8 35/.5);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(250 25% 8%);--fg:hsl(250 20% 94%);--card:hsl(250 22% 12%);--muted:hsl(250 18% 17%);--muted-fg:hsl(250 12% 70%);
    --border:hsl(250 16% 24%);--primary:hsl(262 83% 68%);--primary-fg:hsl(262 60% 10%);--primary-soft:hsl(262 40% 20%);
    --accent:hsl(340 82% 62%);--accent-soft:hsl(340 40% 20%);--sidebar:hsl(262 50% 9%);--sidebar-fg:hsl(262 25% 82%);
    --sidebar-hi:hsl(262 45% 22%);--ring:hsl(262 83% 72%);
    --ok:hsl(142 60% 66%);--ok-bg:hsl(142 40% 15%);--warn:hsl(40 90% 64%);--warn-bg:hsl(35 50% 16%);
    --bad:hsl(0 80% 70%);--bad-bg:hsl(0 45% 18%);--info:hsl(214 90% 72%);--info-bg:hsl(214 45% 18%);
    --neu:hsl(220 10% 72%);--neu-bg:hsl(220 10% 20%);--vio:hsl(262 80% 78%);--vio-bg:hsl(262 35% 20%);
    --shadow:0 1px 2px rgb(0 0 0/.4),0 6px 20px rgb(0 0 0/.35);--overlay:rgb(0 0 0/.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:hsl(250 25% 8%);--fg:hsl(250 20% 94%);--card:hsl(250 22% 12%);--muted:hsl(250 18% 17%);--muted-fg:hsl(250 12% 70%);
    --border:hsl(250 16% 24%);--primary:hsl(262 83% 68%);--primary-fg:hsl(262 60% 10%);--primary-soft:hsl(262 40% 20%);
    --accent:hsl(340 82% 62%);--accent-soft:hsl(340 40% 20%);--sidebar:hsl(262 50% 9%);--sidebar-fg:hsl(262 25% 82%);
    --sidebar-hi:hsl(262 45% 22%);--ring:hsl(262 83% 72%);
    --ok:hsl(142 60% 66%);--ok-bg:hsl(142 40% 15%);--warn:hsl(40 90% 64%);--warn-bg:hsl(35 50% 16%);
    --bad:hsl(0 80% 70%);--bad-bg:hsl(0 45% 18%);--info:hsl(214 90% 72%);--info-bg:hsl(214 45% 18%);
    --neu:hsl(220 10% 72%);--neu-bg:hsl(220 10% 20%);--vio:hsl(262 80% 78%);--vio-bg:hsl(262 35% 20%);
    --shadow:0 1px 2px rgb(0 0 0/.4),0 6px 20px rgb(0 0 0/.35);--overlay:rgb(0 0 0/.6);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}h2{font-size:18px;font-weight:650}h3{font-size:15px;font-weight:650}
p{margin:0}
a{color:var(--primary)}
.ic{width:18px;height:18px;flex-shrink:0;vertical-align:middle}
.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--card);padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.muted{color:var(--muted-fg)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.92em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}.grow{flex:1;min-width:0}
.req{color:var(--bad)}
small{font-size:12px}
/* ===== Shell ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:256px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:70}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-weight:700;color:#fff}
.sb-tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--sidebar-hi)}
.sb-nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.sb-sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:inherit;min-height:38px}
.sb-item:hover{background:var(--sidebar-hi)}
.sb-item.on{background:var(--sidebar-hi);color:#fff;font-weight:600}
.sb-item.dim{opacity:.6}
.sb-item span:first-of-type{flex:1}
.sb-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px;border:0;background:none;color:#fff;cursor:pointer;border-radius:10px;font-weight:650;text-align:left;min-height:38px}
.sb-head:hover,.sb-head.on{background:var(--sidebar-hi)}
.sb-head .pill{margin-left:auto}
.sb-subs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 28px;border-left:1px solid hsl(262 40% 35%);padding-left:8px}
.sb-sub{display:flex;align-items:center;gap:8px;border:0;background:none;color:inherit;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;min-height:32px}
.sb-sub span:first-child{flex:1}
.sb-sub:hover{background:var(--sidebar-hi)}.sb-sub.on{background:hsl(262 83% 58%/.35);color:#fff;font-weight:600}
.pill{font-size:11px;font-weight:650;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:hsl(262 40% 35%);color:#fff}
.pill.warn{background:hsl(38 92% 45%)}.pill.bad{background:var(--accent)}
.sb-foot{padding:14px 16px 18px;border-top:1px solid hsl(262 40% 25%);font-size:12px;display:flex;flex-direction:column;gap:6px}
.sb-foot select{background:var(--sidebar-hi);color:#fff;border:1px solid hsl(262 40% 35%);border-radius:8px;padding:6px 8px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.nav-btn{display:none}
.gsearch{position:relative;flex:1;min-width:200px;max-width:560px}
.gsearch>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.gsearch input{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;max-height:70vh;overflow:auto}
.gres button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.gres button:hover,.gres button:focus-visible{background:var(--muted)}
.gres .gk{grid-row:span 2;font-size:11px;color:var(--muted-fg);width:110px;padding-top:2px}
.gres small{color:var(--muted-fg)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.content{padding:20px 24px 80px;width:100%;max-width:1440px}
/* ===== Botões e controlos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 13px;border:1px solid var(--border);background:var(--card);border-radius:10px;cursor:pointer;font-weight:550;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--muted)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-p:hover{background:hsl(262 83% 52%)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(.95);background:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn-xs{min-height:26px;padding:2px 8px;font-size:12px;border-radius:7px}
.btn-icon{padding:6px;min-width:36px}
.btn-sm.btn-icon{min-width:30px;padding:4px}
.link{border:0;background:none;padding:0;color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit;text-align:left}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],input:not([type]),select,textarea{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px 10px;min-height:36px;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--primary);margin:0}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:550;min-width:0}
.fl>span:first-child{color:var(--fg)}
.fl input,.fl select,.fl textarea{width:100%;font-weight:400}
.fl .help{font-weight:400;color:var(--muted-fg)}
.ferr{color:var(--bad);font-weight:500;font-size:12.5px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fg .span2{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;min-height:30px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:550;min-height:32px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:36px;height:20px;border-radius:12px;background:var(--border);position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0/.3)}
.switch input:checked+.sw{background:var(--primary)}
.switch input:checked+.sw::after{transform:translateX(16px)}
.switch input:focus-visible+.sw{outline:2px solid var(--ring);outline-offset:2px}
.inp-ic{position:relative;display:flex;align-items:center;min-width:180px}
.inp-ic>.ic{position:absolute;left:10px;color:var(--muted-fg)}
.inp-ic input{padding-left:34px;width:100%}
/* ===== Badges, chips ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}.b-neu{background:var(--neu-bg);color:var(--neu)}.b-violet{background:var(--vio-bg);color:var(--vio)}
.b-new{background:var(--accent-soft);color:var(--accent)}
.new{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:550;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chip .cnt{font-size:11.5px;opacity:.8}
.chip-o{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--muted);border-radius:7px;padding:1px 7px;font-size:12px;font-weight:550;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
button.chip-o{cursor:pointer}button.chip-o:hover{border-color:var(--primary);color:var(--primary)}
.src{display:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;line-height:1.35;background:var(--primary-soft);color:var(--vio);border:1px dashed hsl(262 60% 60%/.6);border-radius:5px;padding:1px 6px;margin:3px 0 0;white-space:normal;word-break:break-word;font-weight:500;text-align:left;max-width:100%}
body.show-src .src{display:inline-block}
.src-row{display:block}
/* ===== Layout de página ===== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:14px 0 16px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumbs{font-size:12.5px;color:var(--muted-fg);margin-bottom:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:550;color:var(--muted-fg);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;min-height:40px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab .pill{background:var(--muted);color:var(--fg);margin-left:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--primary)}
.kl{font-size:12.5px;color:var(--muted-fg);font-weight:550}.kv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kh{font-size:12px;color:var(--muted-fg)}
.k-warn .kv{color:var(--warn)}.k-bad .kv{color:var(--bad)}.k-ok .kv{color:var(--ok)}.k-info .kv{color:var(--info)}
.filters{padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow>.inp-ic{flex:1 1 240px}
.frow label.inl{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;border:1px solid transparent}
.alert>.ic{margin-top:1px}
.alert.info{background:var(--info-bg);color:var(--info)}.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.neu{background:var(--muted);color:var(--fg)}
.alert b{font-weight:650}
.rules{font-size:12.5px;color:var(--muted-fg);display:flex;gap:6px;align-items:flex-start}
/* ===== Tabelas ===== */
.tw{position:relative;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);max-width:100%}
table{width:100%;border-collapse:collapse;min-width:760px}
table.min-560{min-width:560px}table.min-640{min-width:640px}table.min-900{min-width:900px}table.min-1000{min-width:1000px}
th{text-align:left;font-size:12px;font-weight:650;color:var(--muted-fg);padding:9px 12px;background:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
th button.sort{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;display:inline-flex;gap:3px;align-items:center}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--muted)}
tr.click:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
tr.deleted td{opacity:.6}
tr.grp td{background:var(--primary-soft);font-weight:600}
tr.sub td{background:var(--bg);padding:6px 6px 6px 22px}
tr.subrow td{background:var(--bg)}
tr.subrow td:first-child{padding-left:34px}
td.act{text-align:right;white-space:nowrap}
.row-act{display:inline-flex;gap:4px;align-items:center}
.late{color:var(--bad);font-weight:600}
.stk{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;color:var(--muted-fg);font-size:12.5px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted-fg)}
.empty b{color:var(--fg)}
/* barras */
.seg{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--muted);min-width:120px}
.seg span{display:block;height:100%}
.s-served{background:var(--ok)}.s-stock{background:var(--primary)}.s-po{background:hsl(214 80% 55%)}.s-miss{background:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted-fg)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--muted);width:100px;margin-top:4px}
.sbar .r{background:var(--warn)}.sbar .f{background:var(--ok)}
.prog{height:6px;border-radius:4px;background:var(--muted);overflow:hidden;width:110px}
.prog span{display:block;height:100%;background:var(--primary)}
/* ===== Hoje ===== */
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.flow-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stage{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:var(--shadow);min-width:0}
.stage h3{display:flex;align-items:center;gap:8px;font-size:14px}
.stage .no{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.stage .cnt-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;font-size:13px;min-height:32px}
.stage .cnt-btn:hover{background:var(--primary-soft)}
.stage .cnt-btn b{font-size:15px;font-variant-numeric:tabular-nums}
.flowline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:14px;align-items:stretch}
.fork{display:grid;grid-template-rows:auto auto;gap:10px}
.branch{border:1px dashed var(--border);border-radius:var(--radius);padding:10px;background:var(--bg)}
.branch h4{font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.branch .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.branch .steps .st{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 8px;display:inline-flex;gap:6px;align-items:center}
.branch .steps .st button{font-weight:700}
.arrow{color:var(--muted-fg)}
.stage-arrow{position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--muted-fg);background:var(--bg);border-radius:50%;z-index:2}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--neu);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.qcard:hover{border-color:var(--primary)}
.qcard .qn{font-size:24px;font-weight:700;min-width:36px;font-variant-numeric:tabular-nums}

<body>
<a class="skip" href="#content">Saltar para o conteúdo</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
  <div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div id="sheet-wrap"></div>
<div id="dlg-wrap"></div>
<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Inventário — mockup interativo. Estado em memória (DB) + regras.
   ===================================================================== */
const TODAY = '2026-10-09';
const LS_TAB = 'inv-mockup-tab', LS_DB = 'inv-mockup-db-v3';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
const at = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = (n,l=4) => String(n).padStart(l,'0');
function fmtD(iso){ if(!iso) return '—'; const [y,m,d] = iso.slice(0,10).split('-'); return d+'/'+m+'/'+y; }
function fmtDS(iso){ if(!iso) return '—'; const [,m,d] = iso.slice(0,10).split('-'); return d+'/'+m; }
function fmtDT(iso){ if(!iso) return '—'; return fmtD(iso) + (iso.length > 10 ? ' ' + iso.slice(11,16) : ''); }
function addDays(iso,n){ const d = new Date(iso.slice(0,10)+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b.slice(0,10)+'T12:00:00Z') - new Date(a.slice(0,10)+'T12:00:00Z'))/864e5); }
let CLOCK = null;
function nowStamp(){ if (CLOCK) return CLOCK; const d = new Date(); return TODAY+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const nf = new Intl.NumberFormat('pt-PT'); const nf2 = new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const N = n => nf.format(n || 0);
const eur = n => nf2.format(n || 0) + ' €';
const pct = n => (Math.round(n*10)/10).toString().replace('.',',') + ' %';
function fail(msg){ const e = new Error(msg); e.user = true; throw e; }
const isInt = v => Number.isInteger(v);

/* ===== Permissões (perfis simulados) ===== */
const PERMS_ALL = ['inventory.view','inventory.manage','inventory.receive','inventory.count','contracts.view','purchase_orders.view','purchase_orders.manage','purchase_orders.approve','purchase_orders.view_prices','suppliers.view','suppliers.manage','products.manage_prices'];
const PROFILES = {
  admin:   { t:'Administrador', user:'Admin Demo', perms:PERMS_ALL, note:'Vê e faz tudo.' },
  compras: { t:'Compras', user:'Comprador Demo', perms:['inventory.view','contracts.view','purchase_orders.view','purchase_orders.manage','purchase_orders.approve','purchase_orders.view_prices','suppliers.view','suppliers.manage','products.manage_prices'], note:'Sem receção (consulta) e sem contagens.' },
  armazem: { t:'Fiel de armazém', user:'Armazém Demo', perms:['inventory.view','inventory.manage','inventory.receive','inventory.count','purchase_orders.view','suppliers.view'], note:'Sem contratos (sem Saídas para clientes), sem preços de compra, sem aprovar.' },
  consulta:{ t:'Só consulta', user:'Consulta Demo', perms:['inventory.view','purchase_orders.view'], note:'Só leitura: sem preços, Receção em modo consulta.' }
};
let PROFILE = 'admin';
const can = p => PROFILES[PROFILE].perms.includes(p);
const CUR_USER = () => PROFILES[PROFILE].user;
function need(p, what){ if (!can(p)) fail('Sem permissão: ' + (what || p) + ' (requer ' + p + ').'); }

/* ===== Estado ===== */
let DB = null, ALLOC = null;
const P  = s  => DB.products.find(p => p.sku === s);
const W  = id => DB.warehouses.find(w => w.id === id);
const SU = id => DB.suppliers.find(s => s.id === id);
const PO = id => DB.pos.find(p => p.id === id);
const EC = id => DB.ecs.find(e => e.id === id);
const G  = id => DB.guias.find(g => g.id === id);
const CN = id => DB.counts.find(c => c.id === id);
const pname = s => (P(s) || {name:s}).name;
const wname = id => (W(id) || {name:id}).name;
const sname = id => (SU(id) || {name:id}).name;
function uid(p){ return p + (++DB.seq); }
function bump(){ DB.v++; ALLOC = null; }
function save(){ bump(); lsSet(LS_DB, JSON.stringify(DB)); }

function stockRow(sku, wh, create){
  let r = DB.stocks.find(s => s.sku === sku && s.wh === wh && !s.deleted);
  if (!r && create){ r = { id: uid('S'), sku, wh, loc:'', min:0, max:0, rop:0, qty:0, deleted:false }; DB.stocks.push(r); }
  return r;
}
const qtyAt = (sku, wh) => { const r = stockRow(sku, wh); return r ? r.qty : 0; };
const totalQty = sku => DB.stocks.filter(s => s.sku === sku && !s.deleted).reduce((a,s) => a + s.qty, 0);
const whServes = id => { const w = W(id); return !!(w && w.active && w.serves && !w.deleted); };

/* ===== Livro de movimentos (único caminho para mudar stock) ===== */
const MT = {
  in:   { t:'Entrada',              tone:'ok',     sign: 1 },
  out:  { t:'Saída',                tone:'info',   sign:-1 },
  tin:  { t:'Transf. entrada',      tone:'violet', sign: 1 },
  tout: { t:'Transf. saída',        tone:'violet', sign:-1 },
  adjp: { t:'Ajuste +',             tone:'warn',   sign: 1 },
  adjm: { t:'Ajuste −',             tone:'warn',   sign:-1 },
  ret:  { t:'Devolução fornecedor', tone:'neu',    sign:-1 },
  loss: { t:'Quebra',               tone:'bad',    sign:-1 }
};
function applyMoves(list){
  // valida tudo antes de escrever: se uma linha deixa stock < 0, falha por inteiro
  const tmp = {};
  for (const m of list){
    if (!P(m.sku)) fail('Produto desconhecido: ' + m.sku);
    if (!W(m.wh)) fail('Armazém desconhecido.');
    if (!isInt(m.qty) || m.qty <= 0) fail('Quantidade tem de ser um número inteiro de unidades, maior que zero.');
    const k = m.sku + '|' + m.wh;
    const cur = (k in tmp) ? tmp[k] : qtyAt(m.sku, m.wh);
    const nv = cur + MT[m.type].sign * m.qty;
    if (nv < 0) fail('Saída abaixo de zero: ' + pname(m.sku) + ' em ' + wname(m.wh) + ' tem ' + N(cur) + ' un e pediu ' + N(m.qty) + '. Nada foi registado.');
    tmp[k] = nv;
  }
  const out = [];
  for (const m of list){
    const r = stockRow(m.sku, m.wh, true); const s = MT[m.type].sign; const p = P(m.sku);
    if (s > 0 && m.cost != null && m.cost !== '' && !isNaN(Number(m.cost))){
      const tot = totalQty(m.sku); const c = Number(m.cost);
      p.avg = (tot + m.qty) > 0 ? ((tot * (p.avg || 0)) + m.qty * c) / (tot + m.qty) : c;
    }
    r.qty += s * m.qty;
    const rec = { id: ++DB.seq, at: nowStamp(), type: m.type, sku: m.sku, wh: m.wh, qty: s * m.qty, bal: r.qty, doc: m.doc || '', note: m.note || '', user: m.user || CUR_USER(), cost: (m.cost == null || m.cost === '') ? null : Number(m.cost) };
    DB.moves.push(rec); out.push(rec);
  }
  bump();
  return out;
}

/* ===== Encomendas a fornecedor ===== */
const poUnits = l => l.packs * l.packN;
const poRem = l => poUnits(l) - l.recv - l.cancelled;
function poStatus(p){
  if (p.status !== 'ordered') return p.status;
  let any = false, all = p.lines.length > 0;
  for (const l of p.lines){ if (l.recv > 0) any = true; if (poRem(l) > 0) all = false; }
  if (all) return any ? 'received' : 'cancelled';
  return any ? 'partial' : 'ordered';
}
const poOpen = p => !p.deleted && ['ordered','partial'].includes(poStatus(p));
const poLate = p => poOpen(p) && p.due < TODAY;
const poPublished = p => ['sent','seen','confirmed'].includes(p.portal.state);
function poTotals(p){ let sub = 0, iva = 0; for (const l of p.lines){ const t = l.packs * l.price; sub += t; iva += t * l.iva / 100; } return { sub, iva, total: sub + iva }; }
function poOpenValue(p){ return p.lines.reduce((s,l) => s + poRem(l) / l.packN * l.price * (1 + l.iva/100), 0); }
function prefItem(sku){ return DB.items.find(i => i.sku === sku && i.pref && SU(i.sup) && !SU(i.sup).deleted && SU(i.sup).active); }

function sendPO(p, opts = {}){

/* ligação EC ↔ linhas de PO (derivada, sem duplicar estado) */
function poLinesFor(lineId){ const out = []; for (const p of DB.pos){ if (p.deleted) continue; for (const pl of p.lines) if (pl.ecLine === lineId) out.push([p, pl]); } return out; }
function ecDerived(l){ let po = 0, rec = 0; const links = poLinesFor(l.id); for (const [,pl] of links){ po += pl.ecUnits; rec += pl.ecRecv; } return { poQty: po, recvPO: rec, poOut: po - rec, links }; }
function splitFor(pl, qty, used = 0){
  if (!pl.ecLine) return { toEC: 0, toStock: qty };
  const e = EC(pl.ec); const el = e && e.lines.find(x => x.id === pl.ecLine);
  if (!e || e.deleted || !el || el.voided) return { toEC: 0, toStock: qty, inactive: true, ec: pl.ec };
  const needEC = Math.max(0, pl.ecUnits - pl.ecRecv - used);
  const toEC = Math.min(qty, needEC);
  return { toEC, toStock: qty - toEC, ec: pl.ec };
}
function receiveLines(p, items, wh, guia, opts = {}){
  if (!opts.system) need('inventory.receive', 'receber mercadoria');
  if (p.deleted) fail('A encomenda está eliminada.');
  if (!poOpen(p)) fail(p.id + ' não está em aberto (estado: ' + PST[poStatus(p)][0] + ').');
  if (!W(wh) || W(wh).deleted) fail('Escolha o armazém de destino.');
  const g = guia ? G(guia) : null;
  if (g && g.state !== 'open') fail('A guia ' + g.id + ' não está aberta.');
  const its = items.filter(i => i.qty > 0);
  if (!its.length) fail('Indique pelo menos uma quantidade a receber.');
  const plans = [];
  for (const it of its){
    const l = p.lines.find(x => x.id === it.lineId); if (!l) fail('Linha inexistente.');
    if (!isInt(it.qty)) fail('Quantidades inteiras: ' + pname(l.sku) + '.');
    if (it.qty > poRem(l)) fail('Nunca mais do que falta: ' + pname(l.sku) + ' tem ' + N(poRem(l)) + ' un por receber.');
    plans.push({ l, qty: it.qty, sp: splitFor(l, it.qty) });
  }
  const moves = plans.map(x => ({ type:'in', sku: x.l.sku, wh, qty: x.qty, doc: p.id, note: (x.sp.toEC ? x.sp.toEC + ' un para ' + x.sp.ec + ' (não ficam livres)' : '') + (x.sp.toEC && x.sp.toStock ? ' · ' : '') + (x.sp.toStock ? x.sp.toStock + ' un para stock' : '') + (g ? ' · guia ' + g.id : ''), cost: x.l.price / x.l.packN }));
  const avgBefore = {}; plans.forEach(x => avgBefore[x.l.sku] = P(x.l.sku).avg);
  applyMoves(moves);
  const at0 = opts.date ? opts.date + nowStamp().slice(10) : nowStamp();
  const res = [];
  for (const x of plans){
    x.l.recv += x.qty; x.l.ecRecv += x.sp.toEC;
    const r = { id: uid('R'), at: at0, lineId: x.l.id, sku: x.l.sku, type:'Receção', qty: x.qty, toEC: x.sp.toEC, toStock: x.sp.toStock, ec: x.sp.ec || null, inactive: !!x.sp.inactive, wh, guia: guia || null, state:'Ativa', user: CUR_USER() };
    p.receipts.push(r); res.push(r);
    // EC expede de outro armazém → pedido de transferência
    if (x.sp.toEC){ const e = EC(x.sp.ec); if (e && e.wh !== wh) createTransferReq({ sku: x.l.sku, from: wh, to: e.wh, qty: x.sp.toEC, ec: e.id, auto: true }); }
  }
  if (g && !g.pos.includes(p.id)) g.pos.push(p.id);
  if (g) g.history.push({ at: nowStamp(), t: 'Receção de ' + p.id + ': ' + res.map(r => r.qty + '× ' + r.sku).join(', ') });
  const st = poStatus(p);
  p.log.push({ at: nowStamp(), t: 'Receção em ' + wname(wh) + ': ' + res.map(r => r.qty + ' un ' + r.sku).join(', ') + ' → ' + PST[st][0] });
  bump();
  return { res, avgBefore };
}
function revertReceipt(p, rid, reason){
  need('inventory.receive', 'reverter receções');

  const r = p.receipts.find(x => x.id === rid); if (!r || r.state !== 'Ativa' || r.type !== 'Receção') fail('Receção não está ativa.');
  const l = p.lines.find(x => x.id === r.lineId);
  if (r.toEC){ const e = EC(r.ec); const el = e && e.lines.find(x => x.id === l.ecLine);
    if (e && !e.deleted && el){ const d = ecDerived(el); if (el.served > el.stockQty + d.recvPO - r.toEC) fail('Estas unidades já saíram para o cliente em ' + e.id + '. Reverta a saída primeiro.'); } }
  applyMoves([{ type:'out', sku: r.sku, wh: r.wh, qty: r.qty, doc: p.id, note:'Reversão de receção: ' + reason }]);
  l.recv -= r.qty; l.ecRecv -= r.toEC; r.state = 'Revertida'; r.reason = reason; r.revertedAt = nowStamp();
  p.log.push({ at: nowStamp(), t:'Receção revertida (' + r.qty + ' un ' + r.sku + '): ' + reason });
}
function releaseToStock(p, rid){

  const e = EC(r.ec); if (e && !e.deleted) fail('Só é possível com a Encomenda Cliente inativa (' + r.ec + ' está ativa).');

  p.receipts.push({ id: uid('R'), at: nowStamp(), lineId: r.lineId, sku: r.sku, type:'Passagem para stock', qty: r.toEC, toEC: 0, toStock: r.toEC, ec: r.ec, wh: r.wh, guia: r.guia, state:'Ativa', user: CUR_USER() });
  p.log.push({ at: nowStamp(), t: r.toEC + ' un ' + r.sku + ' passaram para stock livre (EC ' + r.ec + ' inativa)' });
}
function cancelRemainder(p, lineIds, reason, note){
  need('purchase_orders.manage', 'anular resto');
  if (!reason) fail('Escolha o motivo para não receber o resto.');
  if (reason === 'Outro' && (!note || note.trim().length < 3)) fail('Com motivo "Outro", escreva uma nota (mínimo 3 caracteres).');
  if (!poOpen(p)) fail('A encomenda não está em aberto.');
  const batch = uid('B'); let n = 0;
  for (const id of lineIds){
    const l = p.lines.find(x => x.id === id); const rem = poRem(l); if (rem <= 0) continue;
    const ecCut = l.ecLine ? Math.max(0, Math.min(rem, l.ecUnits - l.ecRecv)) : 0;
    l.cancelled += rem; l.ecUnits -= ecCut; n++;
    p.cancels.push({ id: uid('C'), batch, lineId: id, sku: l.sku, qty: rem, ecCut, ec: l.ec || null, reason, note: note || '', at: nowStamp(), user: CUR_USER(), undone:false });
  }
  if (!n) fail('Não há quantidades por receber nas linhas escolhidas.');
  p.log.push({ at: nowStamp(), t:'Resto anulado (' + n + ' linha' + (n>1?'s':'') + '): ' + reason });

function undoCancel(p, cid, wholeBatch){
  need('purchase_orders.manage', 'desfazer anulação');
  const c0 = p.cancels.find(c => c.id === cid); if (!c0 || c0.undone) fail('Anulação já desfeita.');
  const list = wholeBatch ? p.cancels.filter(c => c.batch === c0.batch && !c.undone) : [c0];
  for (const c of list){
    const l = p.lines.find(x => x.id === c.lineId);
    let back = c.ecCut;
    if (c.ecCut){ const e = EC(c.ec); const el = e && e.lines.find(x => x.id === l.ecLine);
      if (!e || e.deleted || !el) back = 0; else { const miss = el.qty - el.stockQty - ecDerived(el).poQty - el.nosupQty; back = Math.max(0, Math.min(c.ecCut, miss)); } }
    l.cancelled -= c.qty; l.ecUnits += back; c.undone = true; c.undoneAt = nowStamp();
  }
  p.log.push({ at: nowStamp(), t:'Anulação desfeita (' + list.length + ' linha' + (list.length>1?'s':'') + ')' });
}

/* ===== Encomendas Clientes: reserva FIFO ===== */
function alloc(){
  if (ALLOC && ALLOC.v === DB.v) return ALLOC;
  const avail = {}, res = {}, resBy = {}, ready = {};
  const list = DB.ecs.filter(e => !e.deleted).sort((a,b) => a.seq - b.seq);
  for (const e of list) for (const l of e.lines){
    if (!l.sku || l.voided) continue;
    const want = Math.max(0, l.stockQty + ecDerived(l).recvPO - l.served); if (!want) continue;
    const k = l.sku + '|' + e.wh;
    if (!(k in avail)) avail[k] = whServes(e.wh) ? qtyAt(l.sku, e.wh) : 0;
    const c = Math.min(want, Math.max(0, avail[k])); avail[k] -= want; ready[l.id] = c;
    res[k] = (res[k] || 0) + want; (resBy[k] = resBy[k] || []); if (!resBy[k].includes(e.id)) resBy[k].push(e.id);
  }
  ALLOC = { v: DB.v, res, resBy, ready };
  return ALLOC;
}
const reservedAt = (sku, wh) => alloc().res[sku + '|' + wh] || 0;
const freeAt = (sku, wh) => qtyAt(sku, wh) - reservedAt(sku, wh);
function ecLineInfo(e, l){
  if (!l.sku) return { st:'service' };
  if (l.voided) return { st:'void' };
  const d = ecDerived(l); const ready = e.deleted ? 0 : (alloc().ready[l.id] || 0);
  const want = Math.max(0, l.stockQty + d.recvPO - l.served);
  const missing = Math.max(0, l.qty - l.stockQty - d.poQty - l.nosupQty);
  const notReady = Math.max(0, want - ready);
  const tr = DB.transfers.find(t => t.state === 'pending' && t.ec === e.id && t.sku === l.sku);
  let st;
  if (l.served >= l.qty) st = 'served';
  else if (ready > 0 && ready >= l.qty - l.served) st = d.recvPO > 0 ? 'recvpo' : 'ready';
  else if (l.nosupQty > 0 && !ready && !d.poOut && !l.served) st = 'nosup';
  else if (l.served > 0 || ready > 0) st = 'partial';
  else if (d.poOut > 0) st = 'waitpo';
  else st = 'missing';
  return { st, ready, want, missing, notReady, nosup: l.nosupQty, d, tr, served: l.served };
}
function ecStatus(e){
  if (e.deleted) return 'deleted';
  const ls = e.lines.filter(l => l.sku && !l.voided);
  if (!ls.length || ls.every(l => l.served >= l.qty)) return 'full';
  if (ls.some(l => l.nosupQty > 0 && l.served < l.qty)) return 'nosup';
  const infos = ls.map(l => ecLineInfo(e, l));
  if (infos.some(i => i.ready > 0 || i.served > 0)) return 'partial';
  if (infos.some(i => i.d.poOut > 0)) return 'waiting';
  return 'partial';
}
const ecReadyCount = e => e.deleted ? 0 : e.lines.filter(l => l.sku && !l.voided && (alloc().ready[l.id] || 0) > 0).length;
function ecSeg(e){
  let s = 0, st = 0, po = 0, mi = 0;
  for (const l of e.lines){ if (!l.sku || l.voided) continue; const i = ecLineInfo(e, l); s += Math.min(l.served, l.qty); st += i.ready; po += Math.max(0, i.d.poOut); mi += Math.max(0, l.qty - Math.min(l.served,l.qty) - i.ready - Math.max(0,i.d.poOut)); }
  return { s, st, po, mi, tot: s + st + po + mi };
}
function nextEC(){ return 'EC-' + pad(++DB.n.ec); }
function expandLines(lines){
  const exp = [];
  for (const ln of lines){
    const p = ln.sku ? P(ln.sku) : null;
    if (p && p.kit) p.kit.forEach(c => exp.push({ sku: c.sku, qty: c.qty * ln.qty, desc:'', fromKit: p.name, price: P(c.sku).sale }));
    else exp.push(ln);
  }
  return exp;
}
function createEC({ origin, client, addr, wh, notes, lines, diag }){
  if (!client || !client.trim()) fail('Indique o cliente.');
  if (!W(wh) || W(wh).deleted) fail('Escolha o armazém de expedição.');
  if (!whServes(wh)) fail(wname(wh) + ' não serve clientes. Escolha outro armazém de expedição.');
  const valid = (lines || []).filter(l => l.sku || l.desc);
  if (!valid.length) fail('Adicione pelo menos uma linha.');
  for (const l of valid){ if (!isInt(l.qty) || l.qty <= 0) fail('Quantidades inteiras e maiores que zero (' + (l.sku || l.desc) + ').'); }
  const date = (CLOCK || nowStamp()).slice(0,10);
  const e = { id: nextEC(), seq: ++DB.seq, origin, client: client.trim(), addr: addr || '', wh, notes: notes || '', date, deleted:false, diag: diag || null, lines:[], log:[] };
  DB.ecs.push(e); bump();
  const created = new Set();
  for (const ln of expandLines(valid)){
    const l = { id: uid('L'), sku: ln.sku || null, desc: ln.desc || '', qty: ln.qty, price: ln.price != null ? ln.price : (ln.sku ? P(ln.sku).sale : 0), stockQty:0, nosupQty:0, served:0, voided:false, fromKit: ln.fromKit || null, exits:[] };
    e.lines.push(l);
    if (l.sku) allocateLine(e, l, created);
  }
  e.log.push({ at: nowStamp(), t: 'Criada (' + originLabel(e) + ')' });
  flushAutoPOs(created);
  bump();
  return e;
}
function allocateLine(e, l, created){
  bump();
  const miss = l.qty - l.stockQty - ecDerived(l).poQty - l.nosupQty; if (miss <= 0) return;
  const free = whServes(e.wh) ? Math.max(0, freeAt(l.sku, e.wh)) : 0;
  const fromStock = Math.min(miss, free); l.stockQty += fromStock; bump();
  const rest = miss - fromStock;
  if (rest > 0){ const it = prefItem(l.sku); if (!it) l.nosupQty += rest; else addToPO(e, l, it, rest, created); }
}
function addToPO(e, l, it, units, created){
  const ref = e.origin.ref || e.id;
  let p = DB.pos.find(x => !x.deleted && x.sup === it.sup && x.originKey === ref && x.status === 'pending');
  if (!p){ p = newPO({ sup: it.sup, origin: { k: e.origin.k === 'manual' ? 'EC' : e.origin.k, ref, client: e.client, ec: e.id }, wh: e.wh, auto: true }); }
  const packs = Math.ceil(units / it.packN);
  p.lines.push({ id: uid('PL'), sku: l.sku, itemId: it.id, packN: it.packN, unitLabel: it.unitLabel, packs, price: it.price, iva: 23, recv: 0, cancelled: 0, ec: e.id, ecLine: l.id, ecUnits: units, ecRecv: 0 });
  p.log.push({ at: nowStamp(), t: 'Linha ' + l.sku + ': ' + packs + ' × ' + it.unitLabel + ' (= ' + (packs * it.packN) + ' un) para ' + e.id });
  if (created) created.add(p.id);
  bump();
}
function flushAutoPOs(created){
  if (DB.settings.autoPO !== 'direct') return;
  for (const id of created){ const p = PO(id); if (p && p.status === 'pending') sendPO(p, { auto: true }); }
}
function requestMissing(e){
  if (e.deleted) fail('Encomenda eliminada.');
  const created = new Set(); let n = 0;
  for (const l of e.lines){ if (!l.sku || l.voided) continue;
    const before = JSON.stringify([l.stockQty, l.nosupQty, ecDerived(l).poQty]);
    l.nosupQty = 0; allocateLine(e, l, created);
    if (JSON.stringify([l.stockQty, l.nosupQty, ecDerived(l).poQty]) !== before) n++; }
  flushAutoPOs(created);
  e.log.push({ at: nowStamp(), t:'Pedido o que falta: ' + (created.size ? [...created].join(', ') : 'sem novas encomendas') });
  return { n, pos: [...created] };
}
function shipLine(e, l, qty, wh){
  need('inventory.manage', 'confirmar saídas');
  if (e.deleted) fail('Encomenda eliminada.');
  if (!isInt(qty) || qty <= 0) fail('Quantidade inteira maior que zero.');
  const i = ecLineInfo(e, l);
  if (l.served >= l.qty) fail('Linha já servida.');
  if (wh === e.wh){ if (qty > i.ready) fail('Só há ' + i.ready + ' un prontas a sair em ' + wname(wh) + ' para esta linha (reserva FIFO).'); }
  else { if (qty > i.want) fail('A linha só tem ' + i.want + ' un atribuídas.'); if (qty > Math.max(0, freeAt(l.sku, wh))) fail('Stock livre insuficiente em ' + wname(wh) + '.'); }
  const [m] = applyMoves([{ type:'out', sku: l.sku, wh, qty, doc: e.id, note: e.client }]);
  l.served += qty; l.exits.push({ id: m.id, wh, qty, at: m.at, reverted: false });
  e.log.push({ at: nowStamp(), t:'Saída ' + qty + ' un ' + l.sku + ' de ' + wname(wh) });
}
function revertExit(e, l){
  need('inventory.manage', 'reverter saídas');
  const x = [...l.exits].reverse().find(z => !z.reverted); if (!x) fail('Sem saídas para reverter.');
  applyMoves([{ type:'in', sku: l.sku, wh: x.wh, qty: x.qty, doc: e.id, note:'Estorno de saída' }]);
  x.reverted = true; l.served -= x.qty;
  e.log.push({ at: nowStamp(), t:'Saída revertida: ' + x.qty + ' un ' + l.sku });
}
function deleteEC(e, reason, opts = {}){
  if (!opts.contractCancel && !['manual','VD'].includes(e.origin.k)) fail('Só se eliminam encomendas manuais ou de venda direta. Para contratos, anule o contrato.');
  if (!reason || reason.trim().length < 3) fail('Motivo obrigatório (mínimo 3 caracteres).');
  if (e.deleted) fail('Já eliminada.');
  // 1) estorna saídas (valida tudo junto)
  const back = [];
  for (const l of e.lines) for (const x of (l.exits || [])) if (!x.reverted) back.push({ type:'in', sku: l.sku, wh: x.wh, qty: x.qty, doc: e.id, note: 'Estorno: ' + (opts.contractCancel ? 'contrato anulado' : 'EC eliminada') });
  if (back.length) applyMoves(back);
  for (const l of e.lines){ for (const x of (l.exits || [])) x.reverted = true; l.served = 0; }
  // 2) POs ligadas
  for (const p of DB.pos){ if (p.deleted) continue;
    const linked = p.lines.filter(pl => pl.ec === e.id); if (!linked.length) continue;
    if (p.status === 'pending'){ p.lines = p.lines.filter(pl => pl.ec !== e.id); if (!p.lines.length){ p.status = 'cancelled'; } p.log.push({ at: nowStamp(), t:'Linhas de ' + e.id + ' retiradas (EC eliminada)' }); }
    else if (poOpen(p)){ const ids = linked.filter(pl => poRem(pl) > 0).map(pl => pl.id);
      for (const id of ids){ const pl = p.lines.find(x => x.id === id); const rem = poRem(pl); pl.cancelled += rem; pl.ecUnits = pl.ecRecv; p.cancels.push({ id: uid('C'), batch: uid('B'), lineId: id, sku: pl.sku, qty: rem, ecCut: 0, ec: e.id, reason:'EC eliminada', note: reason, at: nowStamp(), user: CUR_USER(), undone:false, locked:true }); }
      if (ids.length) p.log.push({ at: nowStamp(), t:'Resto anulado: ' + e.id + ' eliminada' }); }
  }
  // 3) transferências pendentes

  e.deleted = true; e.deleteReason = reason; e.deletedAt = nowStamp();
  if (e.origin.k === 'VD'){ const vd = DB.vds.find(v => v.ref === e.origin.ref); if (vd) vd.state = 'cancelled'; }

}
function editManualEC(e, header, lines){
  if (e.origin.k !== 'manual') fail('Só encomendas manuais podem ser editadas.');

  Object.assign(e, { client: header.client.trim(), addr: header.addr, notes: header.notes });
  const created = new Set();
  for (const ch of lines){
    if (ch.id){ const l = e.lines.find(x => x.id === ch.id); if (!l) continue;
      if (!isInt(ch.qty) || ch.qty < 1) fail('Quantidades inteiras e maiores que zero.');
      if (ch.qty < l.served) fail('Linha ' + l.sku + ' trancada: já saíram ' + l.served + ' un.');
      if (ch.qty > l.qty){ l.qty = ch.qty; allocateLine(e, l, created); }
      else if (ch.qty < l.qty){ let cut = l.qty - ch.qty; l.qty = ch.qty;
        const a = Math.min(cut, l.nosupQty); l.nosupQty -= a; cut -= a;
        const b = Math.min(cut, Math.max(0, l.stockQty - l.served)); l.stockQty -= b; cut -= b;
        for (const [,pl] of ecDerived(l).links){ if (!cut) break; const c = Math.min(cut, pl.ecUnits - pl.ecRecv); pl.ecUnits -= c; cut -= c; } }
    } else if (ch.sku){ if (!isInt(ch.qty) || ch.qty < 1) fail('Quantidades inteiras e maiores que zero.');
      for (const x of expandLines([ch])){ const l = { id: uid('L'), sku: x.sku, desc:'', qty: x.qty, price: P(x.sku).sale, stockQty:0, nosupQty:0, served:0, voided:false, fromKit: x.fromKit || null, exits:[] }; e.lines.push(l); allocateLine(e, l, created); } }
  }

  e.log.push({ at: nowStamp(), t:'Encomenda manual editada' });
}

function doTransfer(sku, from, to, qty, opts = {}){

  applyMoves([{ type:'tout', sku, wh: from, qty, doc, note: 'Para ' + wname(to) + (opts.note ? ' · ' + opts.note : '') }, { type:'tin', sku, wh: to, qty, doc, note: 'De ' + wname(from) + (opts.note ? ' · ' + opts.note : '') }]);

  doTransfer(t.sku, t.from, t.to, t.qty, { doc: t.id, note: t.ec ? 'para ' + t.ec : '' });
  t.state = 'done'; t.doneAt = nowStamp();
  if (t.ec){ const e = EC(t.ec); if (e && !e.deleted){ const created = new Set(); e.lines.filter(l => l.sku === t.sku).forEach(l => { if (l.nosupQty){ l.nosupQty = 0; allocateLine(e, l, created); } }); flushAutoPOs(created); } }
}

/* ===== Guias ===== */
function guiaRecv(g){ const m = {}; for (const p of DB.pos) for (const r of p.receipts) if (r.guia === g.id && r.state === 'Ativa' && r.type === 'Receção') m[r.sku] = (m[r.sku] || 0) + r.qty; return m; }
function guiaSummary(g){
  const rec = guiaRecv(g); const skus = new Set([...g.ann.map(a => a.sku), ...Object.keys(rec)]);
  const rows = [...skus].map(sku => { const ann = (g.ann.find(a => a.sku === sku) || {}).qty || 0; const r = rec[sku] || 0; const diff = r - ann; return { sku, ann, rec: r, diff, kind: diff === 0 ? 'ok' : !ann ? 'div' : diff < 0 ? 'falta' : 'excesso' }; });
  const anyRec = Object.keys(rec).length > 0;

  return { rows, div, annT: rows.reduce((s,x) => s + x.ann, 0), recT: rows.reduce((s,x) => s + x.rec, 0), anyRec };
}
function saveGuia(d){

  const g = { id: d.no.trim(), sup: d.sup, date: d.date || TODAY, wh: d.wh || DB.settings.defaultWh, ann: (d.ann || []).filter(a => a.sku && a.qty > 0), pos:[], state:'open', note:'', history:[{ at: nowStamp(), t:'Guia criada por ' + CUR_USER() }] };

function closeGuia(g, note){ need('inventory.receive','fechar guias'); if (g.state !== 'open') fail('A guia não está aberta.'); const s = guiaSummary(g); if (s.div && (!note || note.trim().length < 3)) fail('A guia tem ' + s.div + ' divergência(s): escreva uma nota para fechar (mínimo 3 caracteres).'); g.state = 'closed'; g.note = note || ''; g.history.push({ at: nowStamp(), t:'Fechada' + (note ? ': ' + note : '') }); }

/* ===== Contagens ===== */
function countMoved(c, sku){ return DB.moves.filter(m => m.id > c.startSeq && m.wh === c.wh && m.sku === sku && m.doc !== c.id).reduce((s,m) => s + m.qty, 0); }
function countLineInfo(c, l){ const moved = countMoved(c, l.sku); const exp = l.sys + moved; const diff = l.counted == null ? null : l.counted - exp; const pending = l.counted == null || (diff !== 0 && !['adjusted','accepted'].includes(l.res)); return { moved, exp, diff, pending }; }
function createCount({ wh, cat, init }){

  const rows = DB.stocks.filter(s => s.wh === wh && !s.deleted && (!cat || P(s.sku).cat === cat));
  if (!rows.length) fail('Não há produtos em stock para este armazém/categoria.');
  const c = { id: 'INV-2026-' + pad(++DB.n.inv,3), wh, cat: cat || '', state:'open', started: nowStamp(), last: nowStamp(), startSeq: DB.seq, init, lines: rows.map(s => ({ sku: s.sku, sys: s.qty, counted: init === 'system' ? s.qty : null, res:'', note:'' })), moves:[], user: CUR_USER() };

}

  const moves = [];

  const out = moves.length ? applyMoves(moves) : [];

/* ===== Movimento manual (resultado parcial por linha) ===== */
function registerMovement(d){
  need('inventory.manage','registar movimentos');
  if (['adjust','loss'].includes(d.type) && !d.reason) fail('Motivo obrigatório em ' + (d.type === 'adjust' ? 'ajustes' : 'quebras') + '.');
  if (d.type === 'transfer' && d.from === d.to) fail('Origem e destino têm de ser diferentes.');
  const ok = [], failed = [];
  d.lines.forEach((l, i) => {
    try {
      if (!l.sku || !P(l.sku)) fail('Escolha um produto.');
      const q = Number(l.qty); if (!isInt(q) || q <= 0) fail('Quantidade inteira maior que zero.');
      if (d.type === 'in') applyMoves([{ type:'in', sku: l.sku, wh: d.wh, qty: q, doc: d.doc || '', note: [d.supplier ? 'Fornecedor ' + sname(d.supplier) : '', d.note].filter(Boolean).join(' · '), cost: l.cost === '' ? null : l.cost }]);
      else if (d.type === 'out'){
        if (d.ec){ const e = EC(d.ec); const el = e.lines.find(x => x.sku === l.sku && x.served < x.qty); if (!el) fail('Linha já servida em ' + d.ec + '.'); shipLine(e, el, q, d.wh); }
        else applyMoves([{ type:'out', sku: l.sku, wh: d.wh, qty: q, doc: d.doc || '', note: d.note }]);
      }
      else if (d.type === 'transfer'){ if (d.tr){ const t = DB.transfers.find(x => x.id === d.tr); if (t && t.sku === l.sku && t.qty === q && t.from === d.from && t.to === d.to){ execTransferReq(t); return ok.push(i); } } doTransfer(l.sku, d.from, d.to, q, { note: d.note }); }
      else if (d.type === 'adjust') applyMoves([{ type: d.sign === '-' ? 'adjm' : 'adjp', sku: l.sku, wh: d.wh, qty: q, doc: d.doc || '', note: d.reason + (d.note ? ' · ' + d.note : '') }]);
      else if (d.type === 'ret') applyMoves([{ type:'ret', sku: l.sku, wh: d.wh, qty: q, doc: d.doc || '', note: [d.supplier ? 'Para ' + sname(d.supplier) : '', d.note].filter(Boolean).join(' · ') }]);
      else if (d.type === 'loss') applyMoves([{ type:'loss', sku: l.sku, wh: d.wh, qty: q, doc: d.doc || '', note: d.reason + (d.note ? ' · ' + d.note : '') }]);
      ok.push(i);
    } catch(err){ if (!err.user) throw err; failed.push({ i, msg: err.message }); }
  });
  return { ok, failed };
}

/* ===== Convite ao portal, NIF e emails ===== */
function nifCheck(base8){ let s = 0; for (let i = 0; i < 8; i++) s += Number(base8[i]) * (9 - i); const m = s % 11; return base8 + (m < 2 ? 0 : 11 - m); }
function nifValid(n){ n = String(n || '').replace(/\s/g, ''); if (!/^\d{9}$/.test(n)) return false; if (!'1235689'.includes(n[0]) && !/^(45|70|71|72|74|75|77|79|90|91|98|99)/.test(n)) return false; return nifCheck(n.slice(0, 8)) === n; }
const emailOk = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e || '').trim());
function emailOwner(email, exceptSup){ const e = String(email || '').trim().toLowerCase(); if (!e) return null;
  const p = (DB.people || []).find(x => x.email.toLowerCase() === e); if (p) return p.kind + ' (' + p.name + ')';
  const s = DB.suppliers.find(x => !x.deleted && x.id !== exceptSup && String(x.email || '').toLowerCase() === e); if (s) return 'outro fornecedor (' + s.name + ')';
  return null; }
function validateNewSup(d, withPortal){
  const errs = {}, warns = [];
  if (!String(d.name || '').trim()) errs.name = 'Obrigatório.';
  if (!d.company) errs.company = 'Obrigatório.';
  if (withPortal && !String(d.nif || '').trim()) errs.nif = 'NIF obrigatório para convidar.';
  else if (String(d.nif || '').trim() && !nifValid(d.nif)) errs.nif = 'NIF inválido (9 dígitos com dígito de controlo).';
  if (withPortal && !String(d.email || '').trim()) errs.email = 'Email obrigatório para convidar.';
  else if (String(d.email || '').trim()){ if (!emailOk(d.email)) errs.email = 'Email inválido.'; else { const o = emailOwner(d.email); if (o) errs.email = 'Email já usado por ' + o + '.'; } }
  if (withPortal && !String(d.contactName || '').trim()) errs.contactName = 'Indique quem recebe o acesso.';
  if (nifValid(d.nif)){ const dup = DB.suppliers.find(x => !x.deleted && x.nif === String(d.nif).trim()); if (dup) warns.push('NIF já usado por ' + dup.name + '. Confirme que não é o mesmo fornecedor.'); }
  return { errs, warns };
}
function nextSupCode(){ let n = DB.suppliers.length + 1, c; do { c = 'FOR-' + pad(n++, 3); } while (DB.suppliers.some(s => s.code === c)); return c; }
function inviteSupplier(d){

    portal:'invited', portalUsers:0, lastAccess:null, dataConfirmed:false, invitedAt: t, awaiting:true, invite:{ email: d.email.trim(), name: d.contactName.trim(), state:'pending', at: t }, emails:[{ at: t, to: d.email.trim(), t:'Convite para o portal do fornecedor', ok:true }] };
  DB.suppliers.push(s); return s;

function suggestFor(name, ean){
  if (ean){ const p = DB.products.find(x => x.ean === String(ean).trim() && !x.deleted); if (p) return { sku: p.sku, conf:'Exata' }; }
  const words = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter(w => w.length > 2);
  const a = new Set(words(name)); let best = null, bs = 0;
  DB.products.filter(p => !p.kit && !p.deleted).forEach(p => { const b = words(p.name); const hit = b.filter(w => a.has(w)).length; const sc = hit / Math.max(1, Math.min(a.size, b.length)); if (sc > bs){ bs = sc; best = p; } });
  if (!best || bs < 0.25) return null; return { sku: best.sku, conf: bs >= 0.75 ? 'Alta' : bs >= 0.5 ? 'Média' : 'Baixa' };
}
function portalSubmit(sid, f, items){
  const s = SU(sid); if (!s || s.portal !== 'invited') fail('O convite não está pendente.');
  if (!f.password || f.password.length < 8) fail('Password com pelo menos 8 caracteres.');

  if (!String(f.city || '').trim()) fail('Indique a cidade.');
  if (f.sla === '' || !isInt(Number(f.sla)) || Number(f.sla) < 0) fail('Prazo de entrega: inteiro ≥ 0 dias.');
  const its = (items || []).filter(i => String(i.ref || '').trim() || String(i.name || '').trim());
  const seen = new Set();
  for (const i of its){
    if (!String(i.ref).trim() || !String(i.name).trim()) fail('Cada artigo precisa de referência e nome.');
    if (i.price === '' || isNaN(Number(i.price)) || Number(i.price) < 0) fail('Preço inválido em ' + i.ref + '.');
    if (!isInt(Number(i.packN)) || Number(i.packN) < 1) fail('Unidades por embalagem inválidas em ' + i.ref + '.');
    if (!isInt(Number(i.moq || 1)) || Number(i.moq || 1) < 1) fail('MOQ inválido em ' + i.ref + '.');
    const r = i.ref.trim().toLowerCase(); if (seen.has(r) || DB.catalog.some(c => c.sup === sid && c.ref.toLowerCase() === r)) fail('Referência repetida: ' + i.ref); seen.add(r);
  }
  const t = nowStamp();
  Object.assign(s, { addr: f.addr.trim(), cp: f.cp, city: f.city.trim(), country: f.country || 'Portugal', phone: f.phone || '', web: f.web || '', contact: String(f.contact || '').trim() || s.contact, sla: Number(f.sla) });
  s.portal = 'active'; s.portalUsers = 1; s.lastAccess = t; s.dataConfirmed = true; s.awaiting = false; s.dataUpdatedAt = t; if (s.invite) s.invite.state = 'active';
  its.forEach(i => DB.catalog.push({ id: uid('K'), sup: sid, ref: i.ref.trim(), name: i.name.trim(), ean: String(i.ean || '').trim(), price: Number(i.price), packN: Number(i.packN) || 1, unitLabel: i.unit || 'Unidade', moq: Number(i.moq) || 1, lead: Number(i.lead) || Number(f.sla), state:'unlinked', link:null, sug: suggestFor(i.name, i.ean) }));
  return its.length;
}

/* ===== Setters da edição inline (com as mesmas regras) ===== */
const poLocked = p => poPublished(p) && (p.status === 'pending' || poOpen(p));
function setSupField(sid, k, v){

/* exportar (CSV real) e importar (colar CSV) — mesmo formato nos dois sentidos */
function csvCell(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function toCSV(cols, rows){ return '﻿' + [cols.map(c => c[0]).join(';'), ...rows.map(r => cols.map(c => csvCell(c[1](r))).join(';'))].join('\r\n'); }
function download(name, text, type){ try { const b = new Blob([text], { type: type || 'text/csv;charset=utf-8' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return true; } catch(e){ toast('O navegador bloqueou a transferência.', 'bad'); return false; } }
function parseCSV(t){ t = String(t || '').replace(/^﻿/, ''); const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++){ const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ';' || ch === ','){ if (ch === ',' && t.indexOf(';') >= 0){ cur += ch; } else { row.push(cur); cur = ''; } }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && t[i+1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cur += ch; }
  row.push(cur); if (row.some(x => x !== '')) rows.push(row); return rows; }
const XP = {};   // definições de exportação/importação por entidade (preenchidas nos ecrãs)
function doExport(kind, ctx){ const x = XP[kind]; const rows = x.rows(ctx); if (download(x.file + '.csv', toCSV(x.cols, rows))) toast('Exportado: ' + rows.length + ' linha(s) para ' + x.file + '.csv (mesmas colunas da importação).', 'ok'); }
function importDlg(kind, ctx){
  const x = XP[kind]; D = { text:'', prev:null, kind, ctx };
  openDlg(() => {
    const prev = D.prev; const cnt = k => prev ? prev.filter(r => r.st === k).length : 0;
    return dlgShell('Importar ' + x.label,
      '<div class="alert info">' + ic('info') + '<div>Mesmo formato da exportação (no produto: XLSX; neste mockup: CSV com <b>;</b>). Colunas: <span class="mono">' + x.cols.map(c => c[0]).join(';') + '</span>' + (x.rule ? '<br>' + x.rule : '') + '</div></div>' +
      '<div class="row"><button class="btn btn-sm" onclick="D.text=toCSV(XP[D.kind].cols,XP[D.kind].rows(D.ctx)).replace(/^\\ufeff/,\'\');D.prev=null;R()">' + ic('download') + 'Colar a exportação atual como modelo</button>' +
      '<label class="btn btn-sm">' + ic('upload') + 'Escolher ficheiro CSV<input type="file" accept=".csv,text/csv" class="sr" onchange="readImportFile(this)"></label></div>' +
      fld('Conteúdo CSV', '<textarea id="imp-text" rows="7" class="mono" oninput="D.text=this.value;D.prev=null">' + at(D.text) + '</textarea>') +
      (prev ? '<div class="row">' + B(cnt('Novo') + ' Novo','ok') + B(cnt('Atualizar') + ' Atualizar','info') + B(cnt('Sem alterações') + ' Sem alterações','neu') + B(cnt('Erro') + ' Erro','bad') + '</div>' +
        '<div class="tw"><table class="min-560"><thead><tr><th>#</th><th>Chave</th><th>Estado</th><th>Detalhe</th></tr></thead><tbody>' + (prev.length ? prev.map((r, i) => '<tr><td>' + (i + 2) + '</td><td class="mono">' + at(r.key) + '</td><td>' + B(r.st, { 'Novo':'ok','Atualizar':'info','Sem alterações':'neu','Erro':'bad' }[r.st]) + '</td><td>' + at(r.msg || '') + '</td></tr>').join('') : '<tr><td colspan="4" class="muted">Sem linhas.</td></tr>') + '</tbody></table></div>' : ''),
      '<button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn" onclick="impPreview()">' + ic('eye') + 'Pré-visualizar</button><button class="btn btn-p" ' + (prev && (cnt('Novo') + cnt('Atualizar')) ? '' : 'disabled') + ' onclick="impApply()">Importar ' + (prev ? (cnt('Novo') + cnt('Atualizar')) : '') + ' linha(s)</button>');
  }, true);
}
function readImportFile(inp){ const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { D.text = String(r.result); D.prev = null; R(); }; r.readAsText(f, 'utf-8'); }
function impRows(){ const x = XP[D.kind]; const rows = parseCSV(D.text); if (!rows.length) return []; const head = rows[0].map(h => h.trim().toLowerCase()); const want = x.cols.map(c => c[0].toLowerCase());
  if (want.some(w => !head.includes(w))) fail('Cabeçalho diferente do formato de exportação. Esperado: ' + x.cols.map(c => c[0]).join(';'));
  return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; }); }
function impPreview(){ try { const rows = impRows(); D.prev = rows.map(o => XP[D.kind].check(o, D.ctx)); R(); } catch(e){ if (e.user) toast(e.message, 'bad'); else throw e; } }
function impApply(){ const x = XP[D.kind]; let n = 0; act(() => { const rows = impRows(); const checks = rows.map(o => x.check(o, D.ctx)); rows.forEach((o, i) => { const c = checks[i]; if (c.st === 'Novo' || c.st === 'Atualizar'){ x.apply(o, c, D.ctx); n++; } }); }, () => n + ' linha(s) importadas.'); closeDlg(); }

/* ===== Edição inline: clicar → editar → Enter/sair grava, Esc cancela ===== */
const IEH = {}; let IEK = null;
const PERMWHY = p => 'Sem permissão: requer ' + p + '. Peça acesso a um administrador.';
const perm = p => can(p) ? '' : 'disabled title="' + PERMWHY(p) + '"';
function ie(key, val, setter, o = {}){
  IEH[key] = { setter, type: o.type || 'text' };
  const shown = o.display != null ? o.display : at(val === '' || val == null ? '—' : val);
  if (o.lock) return '<span class="lk">' + shown + ' <span class="lk-ic" title="' + at(o.lock) + '" aria-label="Bloqueado: ' + at(o.lock) + '">' + ic('lock','sm') + '</span>' + (o.unlock || '') + '</span>';
  if (o.perm && !can(o.perm)) return '<span class="lk">' + shown + ' <span class="lk-ic" title="' + PERMWHY(o.perm) + '">' + ic('lock','sm') + '</span></span>';
  if (o.type === 'bool') return '<label class="switch" onclick="event.stopPropagation()"><input type="checkbox" ' + (val ? 'checked' : '') + ' onchange="ieBool(\'' + key + '\',this.checked)"><span class="sw"></span><span>' + (o.label || '') + '</span></label>';
  if (IEK === key){
    const common = 'id="ie-in" class="ie-in" aria-label="Editar" onclick="event.stopPropagation()" onkeydown="ieKey(event)" onblur="ieCommit(this.value,\'' + key + '\')"';
    if (o.type === 'select') return '<select ' + common + ' onchange="ieCommit(this.value,\'' + key + '\')">' + o.opts.map(([v, t]) => '<option value="' + at(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + at(t) + '</option>').join('') + '</select>';
    if (o.type === 'textarea') return '<textarea ' + common + ' rows="3" maxlength="2000">' + at(val) + '</textarea><small class="muted">Ctrl+Enter grava · Esc cancela</small>';
    return '<input ' + common + ' type="' + (o.type || 'text') + '" value="' + at(val) + '"' + (o.attrs ? ' ' + o.attrs : '') + '>';
  }
  return '<button type="button" class="ie" title="Clique para editar" onclick="event.stopPropagation();ieOpen(\'' + key + '\')"><span>' + shown + '</span>' + ic('edit','sm ie-ic') + '</button>';
}
function ieOpen(k){ IEK = k; R(); const n = document.getElementById('ie-in'); if (n){ n.focus(); try { if (n.select) n.select(); } catch(_){} } }
function ieKey(e){
  if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); IEK = null; R(); return; }
  if (e.key === 'Enter' && (e.target.tagName !== 'TEXTAREA' || e.ctrlKey || e.metaKey)){ e.preventDefault(); ieCommit(e.target.value, IEK); }
}
function ieCommit(v, key){ if (!key || key !== IEK) return; const h = IEH[key]; IEK = null; if (!h){ R(); return; } const r = act(() => h.setter(v), 'Gravado.'); if (r === undefined) R(); }
function ieBool(key, v){ const h = IEH[key]; if (!h) return; const r = act(() => h.setter(v), 'Gravado.'); if (r === undefined) R(); }
const unlockBtn = (label, on) => ' <button type="button" class="btn btn-xs" onclick="event.stopPropagation();' + on + '">' + ic('lock','sm') + label + '</button>';

function counts(){
  const pos = DB.pos.filter(p => !p.deleted);
  const ecs = DB.ecs.filter(e => !e.deleted);
  const low = new Set(DB.stocks.filter(s => !s.deleted && W(s.wh) && !W(s.wh).deleted && s.rop > 0 && freeAt(s.sku, s.wh) < s.rop).map(s => s.sku + '|' + s.wh)).size;
  const stalled = DB.counts.filter(c => c.state === 'open' && daysBetween(c.last, TODAY) >= 7).length;
  return {
    pending: pos.filter(p => p.status === 'pending').length,
    ordered: pos.filter(p => poStatus(p) === 'ordered').length,
    partialPO: pos.filter(p => poStatus(p) === 'partial').length,
    late: pos.filter(poLate).length,
    portalUnseen: pos.filter(p => poOpen(p) && p.portal.state === 'sent').length,
    portalConfirmed: pos.filter(p => poOpen(p) && p.portal.state === 'confirmed').length,
    openValue: pos.filter(poOpen).reduce((s,p) => s + poOpenValue(p), 0),
    ecOpen: ecs.filter(e => ecStatus(e) !== 'full').length,
    ecReady: ecs.filter(e => ecReadyCount(e) > 0).length,
    ecNoSup: ecs.filter(e => ecStatus(e) === 'nosup').length,
    ecWaiting: ecs.filter(e => ecStatus(e) === 'waiting').length,
    ecPartial: ecs.filter(e => ecStatus(e) === 'partial').length,
    transfers: DB.transfers.filter(t => t.state === 'pending').length,
    awaiting: DB.suppliers.filter(x => !x.deleted && x.portal === 'invited' && x.awaiting).length,
    catUnlinked: DB.catalog.filter(c => c.state === 'unlinked' && SU(c.sup) && !SU(c.sup).deleted).length,
    prices: DB.prices.filter(c => c.state === 'pending' && SU(c.sup) && !SU(c.sup).deleted).length,
    low, stalled, countsOpen: DB.counts.filter(c => c.state === 'open').length,
    guiasOpen: DB.guias.filter(g => g.state === 'open').length,
    guiasDiv: DB.guias.filter(g => g.state === 'open' && guiaSummary(g).div > 0).length,
    reservedUnits: Object.values(alloc().res).reduce((a,b) => a + b, 0),
    stockValue: DB.stocks.filter(s => !s.deleted).reduce((a,s) => a + s.qty * (P(s.sku).avg || P(s.sku).cost), 0),
    excess: DB.stocks.filter(s => !s.deleted && s.max > 0 && s.qty > s.max).length
  };
}

function lastRecDate(p){ const r = p.receipts.filter(x => x.state === 'Ativa').map(x => x.at).sort(); return r.length ? r[r.length - 1].slice(0,10) : ''; }
function poFiltered(){
  const f = F.po, qq = f.q.trim().toLowerCase();
  let l = DB.pos.filter(p => f.deleted ? true : !p.deleted);
  if (f.status === 'late') l = l.filter(poLate); else if (f.status === 'portal') l = l.filter(p => !p.deleted && poPublished(p)); else if (f.status !== 'all') l = l.filter(p => poStatus(p) === f.status);
  if (f.sup) l = l.filter(p => p.sup === f.sup);
  if (qq) l = l.filter(p => [p.id, sname(p.sup), p.origin.ref || '', p.origin.client || '', p.origin.ec || '', ...p.lines.map(x => x.sku + ' ' + pname(x.sku) + ' ' + (P(x.sku) || {}).ean)].join(' ').toLowerCase().includes(qq));
  const df = f.dateField === 'date' ? (p => p.date) : (p => lastRecDate(p));
  if (f.from) l = l.filter(p => df(p) && df(p) >= f.from); if (f.to) l = l.filter(p => df(p) && df(p) <= f.to);
  const key = { date: p => p.date + p.id, due: p => p.due, value: p => poTotals(p).total, id: p => p.id }[f.sort] || (p => p.date);
  return l.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * f.dir; });
}
function portalTag(p){
  if (p.deleted || p.status === 'pending' || poStatus(p) === 'cancelled') return '';
  const x = p.portal;
  if (x.state === 'confirmed') return B('Confirmada · entrega ' + fmtDS(x.promised), 'ok');
  if (x.state === 'seen') return B('No portal · vista ' + fmtDS(x.seen), 'info');
  if (x.state === 'sent') return B('No portal · por ver', 'neu');
  if (x.state === 'withdrawn') return B('Retirada do portal', 'warn');
  if (x.state === 'email') return B('Enviada por email', 'neu');
  return '';
}

function mwWarn(i){

  const sku = parseProd(l.p); if (!sku) return [['bad','Produto não reconhecido. Escolha da lista ou leia o código.']];

  if (MW.lines.some((x, j) => j !== i && parseProd(x.p) === sku)) w.push(['warn','Produto repetido noutra linha.']);
  const q = Number(l.qty); if (l.qty !== '' && (!isInt(q) || q <= 0)) w.push(['bad','Quantidade inteira maior que zero.']);
  if (OUTGOING(MW)){ const wh = MW.type === 'transfer' ? MW.from : MW.wh; const have = qtyAt(sku, wh), res = reservedAt(sku, wh), free = have - res;
    if (q > have) w.push(['bad','Saída abaixo de zero: só há ' + have + ' un em ' + wname(wh) + '. Esta linha vai falhar.']);

}

/* ===================== Armazém › Receção ===================== */
function RC(){ return DB.rc; }
function RCset(o){ Object.assign(DB.rc, o); if (o.guia){ const g = G(o.guia); if (g){ DB.rc.sup = g.sup; DB.rc.wh = g.wh; } } save(); }
function rcCandidates(sku){
  const rc = RC(); const g = rc.guia ? G(rc.guia) : null; const sup = g ? g.sup : rc.sup;
  const out = [];
  DB.pos.filter(p => poOpen(p) && (!sup || p.sup === sup) && (!rc.poFilter || p.id === rc.poFilter)).sort((a, b) => a.date > b.date ? 1 : a.date < b.date ? -1 : 0).forEach(p => p.lines.forEach(l => { if (l.sku === sku && poRem(l) > 0) out.push([p, l]); }));
  return out;
}
function rcPlan(){
  const rc = RC(); const used = {}; const items = []; const errors = [], warns = [], infos = [];
  const g = rc.guia ? G(rc.guia) : null;
  for (const it of rc.basket){
    let cands = rcCandidates(it.sku); if (it.line){ const [pid, lid] = it.line.split('|'); cands = cands.filter(([p, l]) => p.id === pid && l.id === lid); }
    let rest = it.qty; const allocs = [];
    for (const [p, l] of cands){ if (!rest) break; const k = l.id; const free = poRem(l) - (used[k] || 0); if (free <= 0) continue; const n = Math.min(rest, free);
      const usedEC = (used['ec' + k] || 0); const sp = splitFor(l, n, usedEC); used[k] = (used[k] || 0) + n; used['ec' + k] = usedEC + sp.toEC; rest -= n; allocs.push({ p, l, qty: n, toEC: sp.toEC, toStock: sp.toStock, ec: sp.ec, inactive: sp.inactive }); }
    if (rest > 0) errors.push('Sem encomenda aberta para ' + rest + ' un de ' + pname(it.sku) + (cands.length ? ' (nunca mais do que falta)' : (g || rc.sup ? ' deste fornecedor' : '')) + '. Reduza a quantidade.');
    allocs.filter(a => a.inactive).forEach(a => warns.push('EC ' + a.ec + ' inativa: ' + a.qty + ' un de ' + pname(it.sku) + ' entram como stock livre.'));
    if (g && !g.ann.some(a => a.sku === it.sku)) warns.push(pname(it.sku) + ' não está anunciado na guia ' + g.id + '.');
    allocs.filter(a => a.toEC && EC(a.ec) && EC(a.ec).wh !== rc.wh).forEach(a => infos.push(a.toEC + ' un para ' + a.ec + ' (expede de ' + wname(EC(a.ec).wh) + '): é criado um pedido de transferência.'));
    items.push({ it, allocs, rest });
  }
  return { items, errors, warns, infos };
}
function rcScan(code){
  code = String(code || '').trim(); if (!code) return;
  if (!can('inventory.receive')){ toast('Modo consulta: sem permissão para receber.', 'bad'); return; }
  const rc = RC();
  if (!rc.net){ rc.queued.push({ code, at: nowStamp() }); save(); R(); toast('Sem rede: leitura guardada em “por processar”.'); return; }
  const m = lookupCode(code);
  if (!m.length){ rc.rejected.unshift({ code, at: nowStamp() }); save(); R(); toast('Código não reconhecido: ' + code, 'bad'); return; }
  if (m.length > 1){ D = { code, m }; openDlg(() => dlgShell('O código “' + at(code) + '” corresponde a vários produtos', '<p>Escolha o produto que tem na mão:</p><div class="stack" style="gap:6px">' + D.m.map(s => '<button class="btn" style="justify-content:flex-start" onclick="closeDlg();rcAdd(\'' + s + '\')">' + at(pname(s)) + ' <span class="muted mono">' + s + '</span></button>').join('') + '</div>' + src('rpc_receiving_lookup · product_codes'), '<button class="btn" onclick="closeDlg()">Cancelar</button>')); return; }
  rcAdd(m[0]);
}
function rcAdd(sku, n = 1){ const rc = RC(); const b = rc.basket.find(x => x.sku === sku && !x.line); if (b) b.qty += n; else rc.basket.push({ key: uid('B'), sku, qty: n, line:'' }); rc.ack = false; rc.result = null; save(); R(); }
function rcConfirm(){
  const rc = RC(); const plan = rcPlan();
  if (!can('inventory.receive')) return toast('Modo consulta.', 'bad');
  if (!rc.basket.length) return toast('O cesto está vazio.', 'bad');
  if (plan.errors.length) return toast(plan.errors[0], 'bad');
  if (plan.warns.length && !rc.ack) return toast('Marque “Confirmo que recebo mesmo assim”.', 'bad');
  if (!rc.net){ rc.toConfirm.push({ items: rc.basket.map(b => ({ sku: b.sku, qty: b.qty })), at: nowStamp(), err:'Sem rede ao confirmar' }); rc.basket = []; save(); R(); toast('Sem rede: receção guardada em “por confirmar”.', 'bad'); return; }
  const byPO = {}; plan.items.forEach(x => x.allocs.forEach(a => { (byPO[a.p.id] = byPO[a.p.id] || []).push({ lineId: a.l.id, qty: a.qty }); }));
  const sum = { ec:{}, st:0, n:0, avg:[] };
  const ok = act(() => { Object.keys(byPO).forEach(pid => { const merged = {}; byPO[pid].forEach(i => merged[i.lineId] = (merged[i.lineId] || 0) + i.qty);
      const out = receiveLines(PO(pid), Object.entries(merged).map(([lineId, qty]) => ({ lineId, qty })), rc.wh, rc.guia || null);
      out.res.forEach(r => { sum.n += r.qty; sum.st += r.toStock; if (r.toEC) sum.ec[r.ec] = (sum.ec[r.ec] || 0) + r.toEC; rc.session.unshift({ at: r.at, t: pid + ' · ' + r.qty + '× ' + pname(r.sku) + (r.toEC ? ' · ' + r.toEC + ' para ' + r.ec : '') + (r.toStock ? ' · ' + r.toStock + ' para stock' : '') });
        if (r.toStock){ const p = P(r.sku); sum.avg.push(p.name + ': custo médio ' + eur(out.avgBefore[r.sku]) + ' → ' + eur(p.avg)); } }); });
    rc.basket = []; rc.ack = false;
    rc.result = { n: sum.n, ec: sum.ec, st: sum.st, avg: sum.avg }; return true; });
  if (ok) toast('Receção confirmada: ' + sum.n + ' un.', 'ok');
}

function scrCov(){
  const f = F.cov, qq = f.q.trim().toLowerCase();
  const list = COV.filter(r => !qq || (r.g + ' ' + r.f + ' ' + r.w + ' ' + r.s).toLowerCase().includes(qq));
  const groups = [...new Set(list.map(r => r.g))];
  return head('Mockup · cobertura', 'Cada funcionalidade atual e onde fica na nova UI, com a fonte de dados (que não muda). Nada é removido nem enfraquecido.', '<button class="btn" onclick="download(\'cobertura.csv\',toCSV([[\'ecra_antigo\',r=>r.g],[\'funcionalidade\',r=>r.f],[\'onde_fica\',r=>r.w],[\'alimentado_por\',r=>r.s],[\'novo\',r=>r.n?\'sim\':\'\']],COV))&&toast(\'Cobertura exportada.\',\'ok\')">' + ic('download') + 'Exportar</button>') +
    '<div class="alert warn" style="margin-bottom:14px">' + ic('alert') + '<div><b>Decisão a confirmar:</b> hoje a PO automática nasce como rascunho (pending) e precisa de aprovação (<span class="mono">purchase_orders.approve</span>) antes de ir ao portal; o mockup mostra o envio direto (alternável em Hoje › POs automáticas). O botão “Aprovar e enviar” mantém-se para POs manuais e para quando a aprovação estiver ativa.</div></div>' +
    '<div class="kpis">' + kpi('Funcionalidades mapeadas', COV.length, '', '', 'esta tabela') + kpi('Acréscimos (Novo)', COV.filter(r => r.n).length, 'info', '', 'esta tabela') + kpi('Removidas', 0, 'ok', 'nenhuma', 'esta tabela') + kpi('Entradas de menu', '7 → 2', '', 'Compras e Armazém', 'sidebar') + '</div>' +
    '<div class="card filters"><div class="frow"><div class="inp-ic">' + ic('search') + '<input id="cov-q" type="search" placeholder="Filtrar funcionalidades" value="' + at(f.q) + '" oninput="F.cov.q=this.value;R()" aria-label="Filtrar cobertura"></div></div></div>' +
    tbl(['Funcionalidade atual','Onde fica no novo UI','Alimentado por'], groups.map(g => '<tr class="grp"><td colspan="3">' + g + ' <span class="muted" style="font-weight:500">(' + list.filter(r => r.g === g).length + ')</span></td></tr>' + list.filter(r => r.g === g).map(r => '<tr><td>' + r.f + (r.n ? ' <span class="badge b-new">Novo</span>' : '') + '</td><td><button class="link" onclick="go(\'' + r.r + '\')">' + r.w + '</button></td><td class="mono cov-src" style="font-size:12px">' + r.s + '</td></tr>').join('')).join(''), 'min-900') +
    '<div class="flow-top" style="margin-top:18px;align-items:start"><section class="card pad" aria-labelledby="h-rules"><h2 id="h-rules" style="font-size:16px;margin-bottom:10px">Regras mantidas</h2><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px">' + RULES.map(r => '<li>' + r + '</li>').join('') + '</ol><p class="muted" style="font-size:12.5px;margin-top:10px">Todas aplicadas no motor deste mockup: experimente violá-las (ex.: receber mais do que falta, fechar uma contagem com diferenças, eliminar uma EC de contrato).</p></section>' +

}

function init(){
  let loaded = false; const raw = lsGet(LS_DB);
  if (raw){ try { DB = JSON.parse(raw); if (!DB || !DB.pos || !DB.rc || !DB.settings) throw new Error('estado inválido'); loaded = true; } catch(e){ DB = null; } }
  if (!loaded){ seed(); save(); }
  const t = lsGet(LS_TAB); if (t && NAV[t]) S.route = t;
  const h = (location.hash || '').slice(1); if (NAV[h]) S.route = h;
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (NAV[r] && r !== S.route) go(r); });
  document.addEventListener('click', e => { const m = $('#menu'); if (m && !m.hidden && !m.contains(e.target)) closeMenu(); const gr = $('#gres'); if (gr && !gr.hidden && !e.target.closest('.gsearch')) gr.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; const m = $('#menu'); if (m && !m.hidden){ closeMenu(); return; } if (DLGFN){ closeDlg(); return; } if (SHEETFN){ closeSheet(); return; } toggleNav(false); });
  window.addEventListener('resize', closeMenu);
  render();
}
if (typeof document !== 'undefined' && document.getElementById('content')) init();
