name: CI

on:
  push:
    branches: [main, development-miguel]
  pull_request:
    branches: [main, development-miguel]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Run Edge Function org-scoping regression tests
        run: |
          deno test --no-lock --allow-none -R \
            supabase/functions/_shared/orgScopedQuery.test.ts \
            supabase/functions/auto-schedule/index.test.ts \
            supabase/functions/create-user/index.test.ts \
            supabase/functions/send-schedule-invite/index.test.ts \
            supabase/functions/suggest-schedule-assignee/index.test.ts \
            supabase/functions/export-data/index.test.ts
